{%- assign p = include.p -%}
<article class="card">
  <a class="card-link" href="{{ p.url | relative_url }}">
    <div class="card-img">
      {% if p.image %}<img src="{{ p.image | relative_url }}" alt="" width="600" height="338" loading="lazy">{% else %}<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 29V15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M16 17C16 9 21 4 28 4c0 8-5 13-12 13Z" fill="currentColor"/><path d="M16 21c0-6-4-10-11-10 0 6 4 10 11 10Z" fill="currentColor" opacity=".55"/></svg>{% endif %}
    </div>
    <div class="card-body">
      {% if p.category %}<p class="kicker">{{ p.category }}</p>{% endif %}
      <h3>{{ p.title }}</h3>
      {% if p.description %}<p class="card-desc">{{ p.description }}</p>{% endif %}
      <p class="meta"><time datetime="{{ p.date | date_to_xmlschema }}">{% include data.html d=p.date %}</time></p>
    </div>
  </a>
</article>
